[package]
name = "sky-runtime-rust"
version = "0.1.0"
edition = "2021"
description = "Sky language runtime for Rust - primitives, collections, FFI"

[dependencies]
tokio = { version = "1.0", features = ["full"], optional = true }
serde_json = { version = "1", optional = true }
jsonwebtoken = { version = "9", optional = true }
sha2 = { version = "0.10", optional = true }
rsa = { version = "0.9", features = ["sha2"], optional = true }
subtle = "2"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"], optional = true }
regex = "1"
base64 = "0.22"
hex = "0.4"
percent-encoding = "2"
chrono = "0.4"
chrono-tz = "0.10"
rust_decimal = { version = "1", features = ["serde"] }
bcrypt = { version = "0.17", optional = true }

[features]
default = []
async = ["tokio"]
json = ["serde_json", "jsonwebtoken"]
db = ["sqlx", "tokio"]
crypto = ["sha2", "rsa", "bcrypt"]
full = ["async", "json", "db", "crypto"]

[dev-dependencies]
regex = "1"
proptest = "1"
tokio = { version = "1.0", features = ["full", "test-util", "macros"] }
serde_json = "1"
sha2 = "0.10"
jsonwebtoken = "9"
bcrypt = "0.17"

[package.metadata.sky]
runtime_version = "0.13.0"
