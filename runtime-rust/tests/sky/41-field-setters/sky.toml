[project]
name = "41-field-setters"
version = "0.1.0"
entry = "src/Main.sky"
backend = "rust"

# Local setfieldtest crate, delivered as a file:// git dep (Cargo can't resolve
# a bare path dep through sky's ["rust.dependencies"] — only crates.io version or
# git). setup.sh git-inits ./fieldtest-crate into the cache path below.
["rust.dependencies"]
setfieldtest = { git = "file:///home/arthur/.cache/sky/41-field-setters-crate", branch = "master" }
