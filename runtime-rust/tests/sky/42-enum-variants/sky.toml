[project]
name = "42-enum-variants"
version = "0.1.0"
entry = "src/Main.sky"
backend = "rust"

# Local enumtest crate, delivered as a file:// git dep (Cargo can't resolve a
# bare path dep through sky's ["rust.dependencies"] — only crates.io version or
# git). setup.sh git-inits ./enumtest-crate into the cache path below.
["rust.dependencies"]
enumtest = { git = "file:///home/arthur/.cache/sky/42-enum-variants-crate", branch = "master" }
