[project]
name = "45-async-ffi"
version = "0.1.0"
entry = "src/Main.sky"
backend = "rust"

# Local asyncffi crate, delivered as a file:// git dep (Cargo can't resolve a
# bare path dep through sky's ["rust.dependencies"] — only crates.io version or
# git). setup.sh git-inits ./asyncffi-crate into the cache path below.
["rust.dependencies"]
asyncffi = { git = "file:///home/arthur/.cache/sky/45-async-ffi-crate", branch = "master" }
