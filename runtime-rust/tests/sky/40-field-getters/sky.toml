[project]
name = "40-field-getters"
version = "0.1.0"
entry = "src/Main.sky"
backend = "rust"

# Local fieldtest crate, delivered as a file:// git dep (Cargo can't resolve a
# bare path dep through sky's ["rust.dependencies"] — only crates.io version or
# git). setup.sh git-inits ./fieldtest-crate into the cache path below.
["rust.dependencies"]
fieldtest = { git = "file:///home/arthur/.cache/sky/40-field-getters-crate", branch = "master" }
