# NOT silently emit main.rs. See runtime-rust/docs/superpowers/specs/
# 2026-06-15-go-package-rust-ffi-design.md (DOCUMENT_BLOCKED).
["go.dependencies"]
"github.com/gorilla/mux" = "latest"
