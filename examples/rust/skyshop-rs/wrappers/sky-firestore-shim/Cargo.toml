[package]
name = "sky-firestore-shim"
version = "0.1.0"
edition = "2021"

# Stage-1 STUB: full FFI surface, canned data, ZERO heavy deps (no firestore,
# no tokio) so the whole skyshop-rs app builds fast on `--target rust`. Stage 2
# swaps the bodies for the real `firestore` 0.49 D2-bridge implementation.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "sky_firestore_shim"
path = "src/lib.rs"
