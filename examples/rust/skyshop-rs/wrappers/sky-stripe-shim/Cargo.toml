[package]
name = "sky-stripe-shim"
version = "0.1.0"
edition = "2021"

# Stage-3 REAL: the full FFI surface backed by `async-stripe` 1.0.0-rc.6. Bodies
# drive async Stripe ops to completion on a dedicated current-thread tokio
# runtime (see src/lib.rs block_on — same pattern as the Stage-2 firestore
# shim). Public signatures are byte-identical to the Stage-1 stub so the Sky
# side (`Lib/Stripe.sky`) stays unchanged.
#
# async-stripe 1.0 split the API into per-area crates. We need:
#   * async-stripe          — Client / ClientBuilder (.url() → stripe-mock), StripeError
#   * async-stripe-checkout — CheckoutSession create/retrieve
#   * async-stripe-core     — Customer create
#   * async-stripe-types    — Currency
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "macros"] }

async-stripe = { version = "=1.0.0-rc.6" }
async-stripe-types = { version = "=1.0.0-rc.6" }

[dependencies.async-stripe-checkout]
version = "=1.0.0-rc.6"
features = ["checkout_session"]

[dependencies.async-stripe-core]
version = "=1.0.0-rc.6"
features = ["customer"]

[lib]
name = "sky_stripe_shim"
path = "src/lib.rs"
