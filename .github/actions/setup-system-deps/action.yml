name: Setup system deps
description: >
  Single source of truth for the OS system packages Sky's CI workflows install.
  Toggle package groups via inputs; the action branches on the runner OS so the
  same call is correct on Linux / macOS / Windows. Add a package HERE once and
  every workflow that calls this action picks it up — no per-workflow drift
  (the drift that once left `security-audit` missing the webview -dev libs that
  `examples-sweep` had, failing the `--all-features` gate at `glib-2.0`).

inputs:
  ripgrep:
    description: "Install ripgrep (all OSes). Most jobs need it."
    default: "true"
  webview:
    description: "Linux: WebKitGTK/GTK3/libsoup3/librsvg/JavaScriptCore -dev libs (wry/tao build)."
    default: "false"
  xvfb:
    description: "Linux: xvfb headless display (only when a webview app is RUN, not just built)."
    default: "false"
  bench:
    description: "Linux: hyperfine + apache2-utils (ab)."
    default: "false"
  apache_bench:
    description: "Linux: apache2-utils (ab) only, without hyperfine."
    default: "false"
  musl:
    description: "musl static toolchain — Linux: musl-tools · macOS: musl-cross + sets the musl linker env."
    default: "false"
  coreutils:
    description: "macOS: GNU coreutils + a `timeout` shim added to PATH (scripts use bare GNU `timeout`)."
    default: "false"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        IN_RIPGREP: ${{ inputs.ripgrep }}
        IN_WEBVIEW: ${{ inputs.webview }}
        IN_XVFB: ${{ inputs.xvfb }}
        IN_BENCH: ${{ inputs.bench }}
        IN_APACHE_BENCH: ${{ inputs.apache_bench }}
        IN_MUSL: ${{ inputs.musl }}
        IN_COREUTILS: ${{ inputs.coreutils }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS" in
          Linux)
            APT=""
            if [ "$IN_RIPGREP" = "true" ]; then APT="$APT ripgrep"; fi
            if [ "$IN_WEBVIEW" = "true" ]; then APT="$APT libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev"; fi
            if [ "$IN_XVFB" = "true" ]; then APT="$APT xvfb"; fi
            if [ "$IN_BENCH" = "true" ]; then APT="$APT hyperfine apache2-utils"; fi
            if [ "$IN_APACHE_BENCH" = "true" ]; then APT="$APT apache2-utils"; fi
            if [ "$IN_MUSL" = "true" ]; then APT="$APT musl-tools"; fi
            if [ -n "$APT" ]; then
              sudo apt-get update
              sudo apt-get install -y $APT
            fi
            ;;
          macOS)
            if [ "$IN_RIPGREP" = "true" ]; then brew install ripgrep || true; fi
            if [ "$IN_MUSL" = "true" ]; then
              brew install FiloSottile/musl-cross/musl-cross
              echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=x86_64-linux-musl-gcc" >> "$GITHUB_ENV"
            fi
            if [ "$IN_COREUTILS" = "true" ]; then
              brew install coreutils
              mkdir -p "$HOME/.local/bin"
              ln -sf "$(brew --prefix coreutils)/libexec/gnubin/timeout" "$HOME/.local/bin/timeout"
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            fi
            ;;
          Windows)
            if [ "$IN_RIPGREP" = "true" ]; then choco install ripgrep -y || true; fi
            ;;
        esac
        if command -v rg >/dev/null 2>&1; then rg --version; fi
