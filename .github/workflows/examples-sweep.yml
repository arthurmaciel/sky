# ─────────────────────────────────────────────────────────────────────────────
# Sky Rust-backend EXAMPLES sweep — cross-host Go≡Rust parity gate (FORK-LOCAL).
#
# Runs `runtime-rust/scripts/examples-sweep.sh` (the cornerstone correctness gate:
# per in-scope example BUILD `--target rust` + cargo · RUN headless per shape ·
# EQUIV Go≡Rust per derived mode) on every host Sky supports. The single OS-aware
# `runtime-rust/scripts/lib/checks.sh` drives all three — no per-OS script fork.
#
# WHY FORK-LOCAL. This workflow exercises the Rust backend, which lives ONLY on
# `feat/runtime-rust` in arthurmaciel/sky — it must NEVER run on the upstream repo
# (anzellai/sky). The top-level `if:` repository guard enforces that; nothing here
# pushes anywhere or opens a PR.
#
# HONEST PER-HOST SCOPE (the sweep records SKIP, not red, for a shape a host can't
# run — see EXERCISE_SKIP_RC in lib/checks.sh):
#   ubuntu-latest  — FULL: cli/server/live(browser round-trip)/tui(pty)/webview(xvfb).
#                    All toolchains present; the developer-reference host.
#   macos-latest   — ADAPTED: cli/server/live + tui via BSD `script` + webview via
#                    the real WKWebView display. Browser round-trip runs if the
#                    Playwright chromium install succeeds; else live degrades to a
#                    both-backends boot check (still gates serve-equivalence).
#   windows-latest — (shell: bash = Git Bash / MSYS): build + cli-stdout equiv +
#                    server-body equiv RUN + webview RUN (WebView2 + interactive
#                    desktop session, no xvfb needed) — gated on no-panic. tui
#                    SKIPs (headless pty needs ConPTY/node-pty — winpty needs an
#                    interactive console it lacks) and the live browser round-trip
#                    SKIPs (no chromium system deps). The `go`/`cargo`/`sky`
#                    toolchains build natively; the sweep's bash libs run under
#                    Git Bash.
#
# GATING. Job fails iff the sweep prints `VERDICT: FAIL` (a RED row = build/run/
# equiv divergence). SKIP rows are green-neutral; amber `go-ref-broken` (an
# upstream Go bug) does not fail the job. SKY_SWEEP_FORCE=1 overrides the
# night-gate + the macOS-only mem-guard preflight (CI has neither).
#
# PERF is intentionally NOT gated here — `examples-perf-sweep` is noise-sensitive
# (cold-start / RSS / throughput on shared CI runners). It runs ubuntu-only, on
# workflow_dispatch only, and never fails the build (informational artifact).
# ─────────────────────────────────────────────────────────────────────────────
name: Rust examples sweep

on:
  push:
    branches: [main, 'feat/**']
    # Docs-only pushes change no built artefact — skip the (heavy) sweep.
    # Applies to push/PR triggers only; workflow_dispatch always runs unfiltered.
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# Supersede an in-flight run on the same ref (a newer push wins) — saves runner
# minutes without cancelling unrelated branches.
concurrency:
  group: examples-sweep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  examples-sweep:
    # FORK-LOCAL: only this fork ever runs the Rust sweep. Never upstream.
    if: github.repository == 'arthurmaciel/sky'
    name: examples-sweep (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (24.04) is fine: the modern wry 0.55 / tao 0.35 webview
        # stack links webkit2gtk-4.1 (present on 24.04) — no 22.04 pin needed.
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      # Persist the shared cargo target via actions/cache (below). Point it at a
      # stable path under the runner home so actions/cache can key on it.
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/sky-rust-target
      # sccache is OFF on CI. Its GHA backend (SCCACHE_GHA_ENABLED) uses GitHub's
      # retired v1 Actions-Cache API and fails at the first `rustc -vV` (HTTP 400
      # "ghac services aren't available"), killing every cargo build. CI persists
      # CARGO_TARGET_DIR + ~/.cargo via actions/cache@v4 (v2 service) for
      # equivalent cross-run warmth. SKY_NO_SCCACHE=1 makes lib/env.sh skip the
      # wrapper even though sccache may be on the runner PATH — and, since sccache
      # is off, leaves CARGO_INCREMENTAL at cargo's default so the cached target
      # dir does incremental rebuilds. sccache stays the LOCAL dev fast path.
      SKY_NO_SCCACHE: '1'
      # Force past the night-gate + downgrade the macOS-only mem-guard preflight
      # to a WARN (CI has neither a night window nor mem-guard.sh).
      SKY_SWEEP_FORCE: '1'
      # A >=32-byte test secret so Std.Auth server/live examples boot on BOTH
      # backends (the sweep also sets this, but make it explicit for the job env).
      SKY_AUTH_TOKEN_SECRET: sky-ci-sweep-test-secret-0123456789-abcdef
      # Per-example build ceiling. The local default (180 s) assumes a warm sccache;
      # a cold CI run (and the first run before the cache is populated) needs more
      # headroom even after the pre-warm step. The examples/rust/* FFI ceiling is
      # raised in step too.
      SKY_SWEEP_BUILD_TIMEOUT: '900'
      SKY_SWEEP_BUILD_TIMEOUT_FFI: '2400'
      # Cargo network resilience: the runners flake on crates.io with
      # "[16] Error in the HTTP2 framing layer". Disabling HTTP/2 multiplexing is
      # the known fix; bump the retry count for the rest. (build_rust also retries
      # a transient registry/network failure as a backstop.)
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'

    steps:
      - uses: actions/checkout@v4

      # ── ripgrep — REQUIRED by the sweep's is_out_of_scope Go-FFI filter ─────
      # Without it the scope scan silently fails → Go-FFI examples leak into the
      # set and every one fails `--target rust`. Not preinstalled on the runners.
      - name: Install ripgrep
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update && sudo apt-get install -y ripgrep ;;
            macOS)   brew install ripgrep || true ;;
            Windows) choco install ripgrep -y || true ;;
          esac
          rg --version

      # ── Disk headroom (the sweep refuses to start under 5 GB free) ──────────
      # Linux runners ship ~14 GB free after checkout; cabal build + a shared
      # cargo target (axum/tokio/sqlx/serde) + Go reference builds blow past it.
      # Mirror ci.yml's reclaim. macOS/Windows have more headroom; skip there.
      - name: Free disk space (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet           || true
          sudo rm -rf /usr/local/lib/android      || true
          sudo rm -rf /usr/share/swift            || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /opt/microsoft              || true
          sudo rm -rf /opt/google/chrome          || true
          sudo rm -rf /opt/az                     || true
          sudo swapoff -a                         || true
          sudo rm -f /swapfile /mnt/swapfile      || true
          sudo apt-get clean                      || true
          df -h /

      # ── Haskell toolchain (build the `sky` compiler) ────────────────────────
      # GHC 9.6 per runtime-rust/README ("compiling to typed Go (reference) and
      # Rust … via a Haskell compiler (GHC 9.6)"). cabal 3.10.
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.10.3.0'

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            dist-newstyle
          key: ${{ runner.os }}-cabal-9.6.7-${{ hashFiles('sky-compiler.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-cabal-9.6.7-

      # ── Go (the EQUIV reference backend) ────────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      # ── Rust (the backend under test) ───────────────────────────────────────
      # No nightly: the in-scope examples (the Sky author's upstream set, minus the
      # Go-FFI ones that is_out_of_scope filters) never run `sky add`, so the FFI
      # inspector's `cargo +nightly rustdoc` is never invoked. The only real FFI
      # example, skyshop-rs, is out-of-scope on CI (verified locally).
      - uses: dtolnay/rust-toolchain@stable

      # Cache the shared cargo target + registry (heavy deps compiled once, reused
      # across runs). This is the ONLY Rust cache on CI — sccache's GHA backend is
      # retired (see SKY_NO_SCCACHE above), so actions/cache@v4 carries all warmth.
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ${{ github.workspace }}/.cache/sky-rust-target
          key: ${{ runner.os }}-cargo-${{ hashFiles('runtime-rust/Cargo.lock', 'runtime-rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── Node + Playwright chromium (live browser round-trip) ────────────────
      # Linux/macOS get the full browser stack so live examples run the real
      # round-trip. Windows skips the browser deps (no `--with-deps` support on
      # the Git Bash runner); live there degrades to a both-backends boot check.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node deps + Playwright chromium (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Install Node deps (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: npm ci || npm install

      # ── Webview system deps + xvfb (Linux) ──────────────────────────────────
      # Sky.Webview examples use modern wry 0.55 / tao 0.35, which link
      # webkit2gtk-4.1 + libsoup-3.0 + GTK3 (present on ubuntu-latest/24.04). xvfb
      # gives the headless display the webview app needs to boot. Without these the
      # webview builds sky-fail (no webkit) — a host-capability gap, not a defect.
      - name: Install webview deps + xvfb (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # ── GNU coreutils on macOS (the sweep + libs use bare `timeout`) ────────
      # macOS ships no GNU `timeout`; symlink coreutils' so `timeout` resolves.
      - name: Install GNU coreutils (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install coreutils
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(brew --prefix coreutils)/libexec/gnubin/timeout" "$HOME/.local/bin/timeout"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ── Build the compiler + symlink sky-out/sky (what the sweep expects) ───
      # The sweep invokes $SKY_BIN = $REPO/sky-out/sky. Build exe:sky and symlink
      # (NEVER `cabal install --install-method=copy` — runtime-rust/CLAUDE.md).
      # On Windows the dist-newstyle binary is sky.exe; `ln -sf` under Git Bash
      # creates a usable link to it.
      - name: Build sky compiler
        shell: bash
        run: |
          cabal build exe:sky
          mkdir -p sky-out
          BIN="$(cabal list-bin exe:sky)"
          ln -sf "$BIN" sky-out/sky
          ./sky-out/sky --version

      # ── Pre-warm the Rust dependency tree (populate the cached cargo target) ──
      # The per-example build timeout assumes warm deps. Compile the runtime crate's
      # full dep tree (axum/tokio/sqlx/serde/…) ONCE here — into the SAME shared
      # CARGO_TARGET_DIR the sweep uses — so each example's cargo build reuses the
      # compiled deps instead of cold-compiling the world and timing out. On a
      # cache-restored run this is a near-instant no-op; on the first run it pays the
      # cold cost once and persists it via actions/cache@v4.
      - name: Pre-warm Rust deps
        shell: bash
        run: ( cd runtime-rust && cargo build --features full )

      # ── The sweep (OS-aware lib/checks.sh drives all three hosts) ───────────
      # shell: bash → Git Bash on Windows so the bash-sourced libs run cleanly.
      # SKY_SWEEP_FORCE=1 (job env) overrides the night gate + mem-guard preflight.
      - name: Run examples sweep
        shell: bash
        run: bash runtime-rust/scripts/examples-sweep.sh

      # ── Per-OS job summary: the BUILD·RUN·EQUIV table inline on the run page ─
      # always() so it renders on a RED verdict too (the sweep exits non-zero on
      # FAIL). The .table is fixed-width plain text → fence it to keep alignment.
      # Each matrix job writes its OWN summary, so the run page shows one table
      # per OS. This is the README's job-summary mirror — no commit, no write perms.
      # This step is COSMETIC — it must NEVER fail the job. `set -o pipefail`
      # (GitHub's bash default) + `ls … | head -1` raises SIGPIPE on `ls` when
      # head closes early → the assignment fails → the step (and the job) would
      # exit 1 EVEN ON A GREEN SWEEP (observed on macOS). `set +e +o pipefail`
      # and a trailing `|| true` make it incapable of failing the job.
      - name: Job summary (sweep table)
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          HIST="$HOME/.cache/sky/examples-sweep"
          table="$(ls -t "$HIST"/sweep-*.table 2>/dev/null | head -1)"
          warns="$(ls -t "$HIST"/warnings-*.tsv 2>/dev/null | head -1)"
          verdict="$(grep -h '=== VERDICT:' "$HIST"/run-*.log 2>/dev/null | tail -1 | sed 's/^=== //; s/ ===.*$//')"
          {
            echo "## examples-sweep — ${{ matrix.os }}"
            echo
            [ -n "$verdict" ] && { echo "**${verdict}**"; echo; }
            if [ -n "$table" ] && [ -f "$table" ]; then
              echo '```'; cat "$table"; echo '```'
            else
              echo "_No sweep table found (see the \"Run examples sweep\" step log)._"
            fi
            # Cargo warnings past the generated `#![allow(unused, non_snake_case)]`
            # — each is a genuine codegen defect. Surfaces the cross-OS truth.
            if [ -n "$warns" ] && [ -f "$warns" ]; then
              total="$(awk -F'\t' '{s+=$2} END{print s+0}' "$warns")"
              echo; echo "### Cargo warnings (past \`#![allow]\`): ${total} total"
              if [ "${total:-0}" -gt 0 ]; then
                echo '```'; awk -F'\t' '$2>0 {printf "%-28s %s\n", $1, $2}' "$warns"; echo '```'
              else
                echo "_Clean — 0 warnings across every built example._"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # ── Scoreboard table artifact (always upload, even on a RED verdict) ────
      - name: Upload sweep scoreboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examples-sweep-${{ matrix.os }}
          path: |
            ~/.cache/sky/examples-sweep/sweep-*.table
            ~/.cache/sky/examples-sweep/warnings-*.tsv
            ~/.cache/sky/examples-sweep/*.log
            ~/.cache/sky/examples-sweep/*.equiv
            ~/.cache/sky/examples-sweep/*.equiv.*
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────
  # PERF — ubuntu-only, workflow_dispatch-only, NON-GATING. Perf metrics are
  # noise-sensitive on shared CI runners; we measure + archive, never fail the
  # build on a ratio. Run it deliberately, read the artifact.
  # ───────────────────────────────────────────────────────────────────────────
  examples-perf-sweep:
    if: github.repository == 'arthurmaciel/sky' && github.event_name == 'workflow_dispatch'
    name: examples-perf-sweep (ubuntu, non-gating)
    runs-on: ubuntu-latest
    continue-on-error: true
    # Full perf_set + Go+Rust release builds + throughput runs is long; bound it
    # well under GitHub's 6 h hard ceiling (per-example timeouts keep it shorter).
    timeout-minutes: 330
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/sky-rust-target
      # sccache OFF on CI (retired GHA backend) — see SKY_NO_SCCACHE in the sweep job.
      SKY_NO_SCCACHE: '1'
      SKY_SWEEP_FORCE: '1'
      SKY_AUTH_TOKEN_SECRET: sky-ci-sweep-test-secret-0123456789-abcdef
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'
      # Measure the FULL perf_set (every Rust-buildable example, minus Go-FFI) —
      # NOT the 3-shape RUST_PERF_QUICK subset — to match the README perf table.
      # tui/webview self-limit to build+cold-start (no throughput); per-example
      # timeouts in rust-perf.sh + examples-perf-sweep.sh keep it bounded.

    steps:
      - uses: actions/checkout@v4
      # rg — the perf sweep's example_shape (lib/examples.sh) uses ripgrep.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      # Reclaim aggressively (mirror the sweep job): release builds of the Rust
      # dep tree + the Go reference builds + go-build cache are heavy.
      - name: Free disk space (Linux)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/microsoft /opt/google/chrome /opt/az || true
          sudo swapoff -a || true; sudo rm -f /swapfile /mnt/swapfile || true
          sudo apt-get clean || true
          df -h /
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.6.7'
          cabal-version: '3.10.3.0'
      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            ~/.cabal/packages
            dist-newstyle
          key: ${{ runner.os }}-cabal-9.6.7-${{ hashFiles('sky-compiler.cabal', 'cabal.project') }}
          restore-keys: ${{ runner.os }}-cabal-9.6.7-
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ${{ github.workspace }}/.cache/sky-rust-target
          key: ${{ runner.os }}-cargo-${{ hashFiles('runtime-rust/Cargo.lock', 'runtime-rust/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install perf tools (hyperfine + apache-bench)
        run: sudo apt-get update && sudo apt-get install -y hyperfine apache2-utils
      - name: Build sky compiler
        run: |
          cabal build exe:sky
          mkdir -p sky-out
          ln -sf "$(cabal list-bin exe:sky)" sky-out/sky
          ./sky-out/sky --version
      # Pre-warm the RELEASE dep tree (perf builds with `cargo build --release`,
      # a different/slower target than the sweep's debug build) so the per-example
      # 900s cargo ceiling isn't blown cold-compiling axum/tokio/sqlx in release.
      - name: Pre-warm Rust deps (release)
        run: ( cd runtime-rust && cargo build --release --features full )
      - name: Run perf sweep (informational)
        run: bash runtime-rust/scripts/examples-perf-sweep.sh
      # Upload EVERYTHING under the perf cache (the TSV, the main run log, AND the
      # per-example build logs preserved by examples-perf-sweep.sh) + the raw
      # per-example metric JSONs — so a failure is fully diagnosable from the run.
      - name: Upload perf metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examples-perf-sweep
          path: |
            ~/.cache/sky/examples-perf-sweep/
            /tmp/rust-perf-*.json
          if-no-files-found: warn
