[package]
name = "sse-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", features = ["stream"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
bytes = "1"

[dev-dependencies]
axum = "0.7"
async-stream = "0.3"
tokio = { version = "1", features = ["full"] }
